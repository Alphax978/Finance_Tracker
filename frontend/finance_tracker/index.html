<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Tracker</title>
    <meta name="description" content="Track spending, spot trends, and stay ahead of overspending — all in one place." />

    <!-- Open Graph — the preview card Discord, Slack, Telegram, WhatsApp,
         iMessage, LinkedIn, and most other chat/social apps build whenever
         this link gets pasted. One standard tag set covers all of them. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://financetracker.blog/" />
    <meta property="og:title" content="Finance Tracker" />
    <meta property="og:description" content="Track spending, spot trends, and stay ahead of overspending — all in one place." />
    <meta property="og:image" content="https://financetracker.blog/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X falls back to the og: tags above if these aren't present,
         but summary_large_image is what makes it render as a big banner
         instead of a small thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Finance Tracker" />
    <meta name="twitter:description" content="Track spending, spot trends, and stay ahead of overspending — all in one place." />
    <meta name="twitter:image" content="https://financetracker.blog/og-banner.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
