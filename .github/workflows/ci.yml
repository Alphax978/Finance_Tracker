name: CI

# Triggering on push-to-every-branch AND pull_request would double-run CI on
# every PR commit (both events fire for the same push). Instead: push only
# for the long-lived branches that matter on their own (main, staging), plus
# pull_request for everything else — that covers feature branches the
# moment they're opened for review, without the duplicate run.
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, type-check, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/finance_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/finance_tracker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  backend:
    name: Backend (type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      # No lint or test step — the backend has neither an ESLint config nor
      # any tests yet. Real gap, not hidden: the build step (tsc) is the
      # only automated check backend code currently gets.
